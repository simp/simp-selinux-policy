# Run release engineering checks on Pull Requests
#
# This restores the coverage of the retired GitLab CI 'validation' stage.
#
---
name: PR Tests
'on':
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  releng-checks:
    name: 'RELENG checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby 3.4'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.11
          bundler-cache: true
      - run: 'command -v rpm || if command -v apt-get; then sudo apt-get update; sudo apt-get install -y rpm; fi ||:'
      - name: 'Tags and changelogs'
        run: |
          bundle exec rake pkg:compare_latest_tag
          bundle exec rake pkg:create_tag_changelog

  # The one check for branch protection to require: GitHub only blocks a
  # merge on checks listed by name, and this job fails unless every job it
  # needs succeeded. Add any new job in this workflow to `needs:`.
  all-checks:
    name: 'All checks'
    if: always()
    needs:
      - releng-checks
    runs-on: ubuntu-latest
    steps:
      - name: 'Fail unless every needed job succeeded'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
